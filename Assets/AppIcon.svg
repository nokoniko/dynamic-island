<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" fill="none">
  <defs>
    <linearGradient id="rim" x1="245" y1="155" x2="1355" y2="345" gradientUnits="userSpaceOnUse">
      <stop stop-color="#287BFF"/><stop offset=".52" stop-color="#8654FF"/><stop offset="1" stop-color="#4A68FF"/>
    </linearGradient>
    <linearGradient id="pill" x1="800" y1="150" x2="800" y2="350" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A10"/><stop offset="1" stop-color="#020307"/>
    </linearGradient>
    <linearGradient id="artSky" x1="390" y1="180" x2="555" y2="335" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1465C9"/><stop offset=".45" stop-color="#6E8EFF"/><stop offset=".72" stop-color="#D88BFF"/><stop offset="1" stop-color="#121E55"/>
    </linearGradient>
    <linearGradient id="wave" x1="535" y1="250" x2="1185" y2="250" gradientUnits="userSpaceOnUse">
